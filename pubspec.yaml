name: krudev
description: Krudev video editing app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  video_player: ^2.8.2
  ffmpeg_kit_flutter_full_gpl: ^5.1.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"

flutter:
  uses-material-design: true
  shaders:
    - shaders/color_grade.frag
    
